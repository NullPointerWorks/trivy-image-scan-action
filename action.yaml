name: docker image scanning
description: "Scan Docker images for vulnerabilities using Trivy"
inputs:
  image-name:
    description: "Name of the Docker image to scan"
    required: true
runs:
  using: "composite"
  steps:
    - name: Install Trivy
      shell: bash
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
   
    - name: download trivy html template
      shell: bash
      run: |
        curl -o trivy_template.html https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl 
    - name: Scan Docker image
      shell: bash
      run: |
        trivy image --format template --template "@trivy_template.html" -o trivy_report.html ${{ inputs.image-name }}
    - name: Upload Trivy report
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        image-ref: ${{ inputs.image-name }}
        format: template
        template: "@trivy_template.html"
        output: trivy_report.html
    - name: Upload Trivy report as artifact
      uses: actions/upload-artifact@v6
      with:
        name: trivy-report
        path: trivy_report.html