# .github/actions/setup-java-maven/action.yml
name: "Setup Java and Build"
description: "Sets up JDK, caches Maven dependencies, and builds the project"

inputs:
  java-version:
    description: "Java version to install"
    required: false
    default: "17"

  build-command:
    description: "Command to build the project"
    required: false
    default: "mvn -B clean package"

outputs:
  build-status:
    description: "Build result message"
    value: ${{ steps.build_info.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven

    - name: Build project
      shell: bash
      run: ${{ inputs.build-command }}

    - name: Set output
      id: build_info
      shell: bash
      run: echo "status=Build completed successfully" >> "$GITHUB_OUTPUT"